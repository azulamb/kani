<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カニっぽいの</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #0d1b2a;
      color: #d0dde8;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.9em;
      color: #7ecef4;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }
    header p {
      color: #7a93a8;
      font-size: .85em;
    }

    /* ── Tree wrapper ─────────────────────────── */
    .tree { font-size: 13.5px; }

    /* each node block */
    .node { position: relative; }

    /* vertical connector rendered by child list */
    .children {
      list-style: none;
      padding-left: 28px;
      position: relative;
    }
    .children::before {           /* vertical bar */
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 14px;
      border-left: 1px solid #2e4a62;
    }

    .children > .node {
      position: relative;
      padding-left: 18px;
    }
    .children > .node::before {  /* horizontal arm */
      content: '';
      position: absolute;
      left: 0;
      top: 17px;
      width: 18px;
      border-top: 1px solid #2e4a62;
    }

    /* ── Node header ──────────────────────────── */
    .node-header {
      display: flex;
      align-items: center;
      padding: 5px 10px 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
      width: fit-content;
      max-width: 100%;
    }
    .node-header:hover { background: rgba(126, 206, 244, .08); }

    .toggle-icon {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      flex-shrink: 0;
      color: #4a7fa0;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s;
    }
    .toggle-icon.open { transform: rotate(90deg); }

    /* rank badges */
    .badge {
      font-size: 10px;
      font-weight: bold;
      padding: 1px 7px;
      border-radius: 20px;
      margin-right: 8px;
      flex-shrink: 0;
      letter-spacing: .03em;
    }
    .badge-overview    { background: #1c1c1c; color: #c8c8c8; border: 1px solid #444; }
    .badge-order       { background: #4a2800; color: #ffcc88; }
    .badge-infraorder  { background: #4b0082; color: #d9b8ff; }
    .badge-section     { background: #7f3000; color: #ffd5a0; }
    .badge-subsection  { background: #7f003f; color: #ffb8d5; }
    .badge-superfamily { background: #003f7f; color: #aad4ff; }
    .badge-family      { background: #00604f; color: #a0ffe0; }
    .node-note         { font-size: 10.5px; color: #5a8870; margin-left: 8px; font-style: italic; }

    .node-label { font-weight: 600; white-space: nowrap; }
    .node-label-en {
      color: #5a8099;
      font-style: italic;
      font-size: 11.5px;
      margin-left: 7px;
      white-space: nowrap;
    }

    /* collapsed state */
    .children.hidden { display: none; }

    /* ── Crab card grid ───────────────────────── */
    .crab-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 0 10px 24px;
    }

    .crab-card {
      width: 120px;
      background: #111e2d;
      border: 1px solid #1e3a52;
      border-radius: 8px;
      overflow: hidden;
      transition: transform .18s, box-shadow .18s, border-color .18s;
      flex-shrink: 0;
    }
    .crab-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
      border-color: #4a8fb5;
    }

    .crab-img-wrap {
      width: 100%;
      height: 80px;
      overflow: hidden;
      background: #0a1520;
      position: relative;
    }
    .crab-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #2a4a62;
    }

    .crab-info { padding: 6px 7px 7px; }
    .crab-jp   { font-size: 11.5px; font-weight: 700; color: #c8dce8; }
    .crab-sci  { font-size: 10px; font-style: italic; color: #567a90; margin-top: 2px; }
    .crab-desc { font-size: 10px; color: #4a6878; margin-top: 3px; line-height: 1.4; }
    .crab-wiki { margin-top: 5px; text-align: right; }
    .crab-wiki a { font-size: 9px; color: #2e5a78; text-decoration: none; }
    .crab-wiki a:hover { color: #7ecef4; }

    /* ── Legend ───────────────────────────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #7a93a8;
    }

    /* ── Expand all button ────────────────────── */
    .controls {
      text-align: center;
      margin-bottom: 22px;
    }
    .btn {
      background: #0d2e44;
      border: 1px solid #2e5a78;
      color: #7ecef4;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      margin: 0 4px;
      transition: background .15s;
    }
    .btn:hover { background: #1a4060; }

    .search-input {
      background: #0d2e44;
      border: 1px solid #2e5a78;
      color: #d0dde8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      margin: 0 4px;
      width: 180px;
      outline: none;
      font-family: inherit;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #7ecef4; }
    .search-input::placeholder { color: #4a7fa0; }

    .crab-card.search-match {
      border-color: #7ecef4;
      box-shadow: 0 0 8px rgba(126, 206, 244, .35);
    }
    .crab-card.search-nomatch { opacity: .25; }

    /* ── Source note ──────────────────────────── */
    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 11px;
      color: #3a5568;
    }
    footer a { color: #4a7fa0; }

    /* ── Two-column layout ────────────────────────── */
    #main-layout { display: flex; align-items: flex-start; gap: 20px; }
    #left-col { flex: 1; min-width: 0; }
    #right-panel {
      width: 160px;
      flex-shrink: 0;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .right-panel-title {
      font-size: 10.5px;
      color: #4a7fa0;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding-bottom: 7px;
      border-bottom: 1px solid #1e3a52;
      margin-bottom: 10px;
    }

    /* ── Selected cards (right panel) ────────────── */
    .selected-card {
      background: #111e2d;
      border: 1px solid #1e3a52;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
      scroll-margin-top: 8px;
    }
    .selected-card img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      display: block;
      background: #0a1520;
    }
    .selected-img-ph {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: #0a1520;
      color: #2a4a62;
    }
    .selected-card-name {
      font-size: 11px;
      font-weight: 700;
      color: #c8dce8;
      padding: 5px 6px 4px;
    }
    .selected-delete {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid #1a3248;
      color: #4a6878;
      font-size: 10px;
      padding: 4px 0;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
    }
    .selected-delete:hover { color: #e07070; }

    /* ── Mobile ───────────────────────────────────── */
    @media (max-width: 600px) {
      body { padding: 16px 12px 200px; }
      header { margin-bottom: 22px; }
      header h1 { font-size: 1.35em; }

      /* ツリーのインデントを縮小 */
      .children { padding-left: 18px; }
      .children::before { left: 6px; }
      .children > .node { padding-left: 12px; }
      .children > .node::before { width: 12px; }

      /* 英語学名を非表示 */
      .node-label-en { display: none; }

      /* カードグリッドのパディング縮小 */
      .crab-grid { padding-left: 10px; gap: 8px; }

      /* 右パネルを画面下部に固定 */
      #main-layout { display: block; }
      #right-panel {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: none;
        background: #0d1b2a;
        border-top: 1px solid #2e4a62;
        padding: 8px 12px 16px;
        z-index: 100;
        box-shadow: 0 -6px 24px rgba(0,0,0,.5);
      }
      #selected-list {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }
      .selected-card {
        flex-shrink: 0;
        width: 110px;
        margin-bottom: 0;
        scroll-margin-inline: 4px;
      }
    }
  </style>
</head>

<header>

    <div id="tree" class="tree"></div>
  </div>
  <aside id="right-panel">

</div>

// ─── Root tree ─────────────────────────────────────────────────────────────
const TREE = {
  name: 'カニ・カニに似た節足動物', nameEn: 'Crabs & Crab-like Arthropods', rank: 'overview',
  children: [
    {
      name: '十脚目', nameEn: 'Decapoda', rank: 'order',
      note: '甲殻類十脚目（エビ・カニ・ヤドカリの仲間）',
      children: [BRACHYURA_DATA, ANOMURA_DATA],
    },
    XIPHOSURA_DATA,
  ]
};

// ─── Rank metadata ─────────────────────────────────────────────────────────
const RANK_META = {
  overview:   { label: '概観', cls: 'badge-overview',    defaultOpen: true  },
  order:      { label: '目',   cls: 'badge-order',       defaultOpen: true  },
  infraorder: { label: '下目', cls: 'badge-infraorder',  defaultOpen: true  },
  section:    { label: '群',   cls: 'badge-section',     defaultOpen: true  },
  subsection: { label: '亜群', cls: 'badge-subsection',  defaultOpen: true  },
  superfamily:{ label: '上科', cls: 'badge-superfamily', defaultOpen: false },
  family:     { label: '科',   cls: 'badge-family',      defaultOpen: false },
};

// ─── Render tree ──────────────────────────────────────────────────────────
function buildTree(node) {
  const div = document.createElement('div');
  div.className = 'node';

  const meta = RANK_META[node.rank] || {};
  const hasChildren = node.children && node.children.length > 0;
  const hasCrabs    = node.crabs   && node.crabs.length   > 0;

  // Header
  const header = document.createElement('div');
  header.className = 'node-header';

  // Toggle arrow (only for nodes with children or crabs)
  const arrow = document.createElement('span');
  arrow.className = 'toggle-icon';
  if (hasChildren || hasCrabs) {
    arrow.textContent = '▶';
    if (meta.defaultOpen) arrow.classList.add('open');
  }
  header.appendChild(arrow);

  // Badge
  const badge = document.createElement('span');
  badge.className = `badge ${meta.cls || ''}`;
  badge.textContent = meta.label || node.rank;
  header.appendChild(badge);

  // Labels
  const label = document.createElement('span');
  label.className = 'node-label';
  label.textContent = node.name;
  header.appendChild(label);

  const labelEn = document.createElement('span');
  labelEn.className = 'node-label-en';
  labelEn.textContent = node.nameEn;
  header.appendChild(labelEn);

  if (node.note) {
    const noteEl = document.createElement('span');
    noteEl.className = 'node-note';
    noteEl.textContent = `（${node.note}）`;
    header.appendChild(noteEl);
  }

  div.appendChild(header);

  // Collapsible content
  const content = document.createElement('div');
  content.className = 'collapsible';
  if (!meta.defaultOpen) content.style.display = 'none';

  // Child nodes
  if (hasChildren) {
    const ul = document.createElement('ul');
    ul.className = 'children';
    node.children.forEach(child => ul.appendChild(buildTree(child)));
    content.appendChild(ul);
  }

  // Crab cards
  if (hasCrabs) {
    const grid = document.createElement('div');
    grid.className = 'crab-grid';
    node.crabs.forEach(crab => grid.appendChild(buildCard(crab)));
    content.appendChild(grid);
  }

  if (hasChildren || hasCrabs) {
    div.appendChild(content);

    header.addEventListener('click', () => {
      const open = content.style.display !== 'none';
      content.style.display = open ? 'none' : '';
      arrow.classList.toggle('open', !open);
    });
  }

  return div;
}

function buildCard(crab) {
  const card = document.createElement('div');
  card.className = 'crab-card';

  const wrap = document.createElement('div');
  wrap.className = 'crab-img-wrap';

  if (crab.img) {
    const img = document.createElement('img');
    img.alt = crab.jp;
    img.loading = 'lazy';
    img.onerror = () => { wrap.innerHTML = '<div class="img-placeholder">🦀</div>'; };
    img.src = crab.img.startsWith('https://') ? crab.img : COM(crab.img);
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = '<div class="img-placeholder">🦀</div>';
  }
  card.appendChild(wrap);

  const info = document.createElement('div');
  info.className = 'crab-info';
  const wikiUrl = `https://ja.wikipedia.org/wiki/${encodeURIComponent(crab.jp)}`;
  info.innerHTML =
    `<div class="crab-jp">${crab.jp}</div>` +
    `<div class="crab-sci">${crab.sci}</div>` +
    (crab.desc ? `<div class="crab-desc">${crab.desc}</div>` : '') +
    `<div class="crab-wiki"><a href="${wikiUrl}" target="_blank" rel="noopener">Wikipedia →</a></div>`;
  card.appendChild(info);

  card.style.cursor = 'pointer';
  card.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    addToPanel(crab, card);
  });

  return card;
}

// ─── Selected panel ────────────────────────────────────────────────────────
const selectedCrabs = new Map(); // sci → { panelCard, leftCard }

function revealInTree(el) {
  let node = el.parentElement;
  while (node) {
    if (node.classList.contains('collapsible') && node.style.display === 'none') {
      node.style.display = '';
      const header = node.previousElementSibling;
      if (header) {
        const icon = header.querySelector('.toggle-icon');
        if (icon) icon.classList.add('open');
      }
    }
    node = node.parentElement;
  }
}

function addToPanel(crab, leftCard) {
  if (selectedCrabs.has(crab.sci)) {
    selectedCrabs.get(crab.sci).panelCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    return;
  }

  const panelCard = document.createElement('div');
  panelCard.className = 'selected-card';

  if (crab.img) {
    const img = document.createElement('img');
    img.alt = crab.jp;
    img.onerror = () => img.replaceWith(makePh());
    img.src = crab.img;
    panelCard.appendChild(img);
  } else {
    panelCard.appendChild(makePh());
  }

  const name = document.createElement('div');
  name.className = 'selected-card-name';
  name.textContent = crab.jp;
  panelCard.appendChild(name);

  const del = document.createElement('button');
  del.className = 'selected-delete';
  del.textContent = '削除';
  del.addEventListener('click', () => { panelCard.remove(); selectedCrabs.delete(crab.sci); });
  panelCard.appendChild(del);

  panelCard.style.cursor = 'pointer';
  panelCard.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    revealInTree(leftCard);
    leftCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  });

  document.getElementById('selected-list').appendChild(panelCard);
  selectedCrabs.set(crab.sci, { panelCard, leftCard });
}

function makePh() {
  const d = document.createElement('div');
  d.className = 'selected-img-ph';
  d.textContent = '🦀';
  return d;
}

// ─── Global expand / collapse ──────────────────────────────────────────────
function setAll(open) {
  document.querySelectorAll('.collapsible').forEach(el => {
    el.style.display = open ? '' : 'none';
  });
  document.querySelectorAll('.toggle-icon').forEach(el => {
    if (el.textContent === '▶') el.classList.toggle('open', open);
  });
}

// ─── Search ────────────────────────────────────────────────────────────────
function searchCrabs(query) {
  const cards = document.querySelectorAll('.crab-card');
  if (!query.trim()) {
    cards.forEach(c => c.classList.remove('search-match', 'search-nomatch'));
    return;
  }
  const q = query.trim().toLowerCase();
  setAll(false);
  cards.forEach(card => {
    const jp   = card.querySelector('.crab-jp')?.textContent.toLowerCase()   || '';
    const sci  = card.querySelector('.crab-sci')?.textContent.toLowerCase()  || '';
    const desc = card.querySelector('.crab-desc')?.textContent.toLowerCase() || '';
    if (jp.includes(q) || sci.includes(q) || desc.includes(q)) {
      card.classList.add('search-match');
      card.classList.remove('search-nomatch');
      revealInTree(card);
    } else {
      card.classList.add('search-nomatch');
      card.classList.remove('search-match');
    }
  });
}

// ─── Mount ─────────────────────────────────────────────────────────────────
document.getElementById('tree').appendChild(buildTree(TREE));
</script>
