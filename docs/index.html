<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短尾下目（カニ）系統樹</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #0d1b2a;
      color: #d0dde8;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 1.9em;
      color: #7ecef4;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }
    header p {
      color: #7a93a8;
      font-size: .85em;
    }

    /* ── Tree wrapper ─────────────────────────── */
    .tree { font-size: 13.5px; }

    /* each node block */
    .node { position: relative; }

    /* vertical connector rendered by child list */
    .children {
      list-style: none;
      padding-left: 28px;
      position: relative;
    }
    .children::before {           /* vertical bar */
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 14px;
      border-left: 1px solid #2e4a62;
    }

    .children > .node {
      position: relative;
      padding-left: 18px;
    }
    .children > .node::before {  /* horizontal arm */
      content: '';
      position: absolute;
      left: 0;
      top: 17px;
      width: 18px;
      border-top: 1px solid #2e4a62;
    }

    /* ── Node header ──────────────────────────── */
    .node-header {
      display: flex;
      align-items: center;
      padding: 5px 10px 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
      width: fit-content;
      max-width: 100%;
    }
    .node-header:hover { background: rgba(126, 206, 244, .08); }

    .toggle-icon {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      flex-shrink: 0;
      color: #4a7fa0;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s;
    }
    .toggle-icon.open { transform: rotate(90deg); }

    /* rank badges */
    .badge {
      font-size: 10px;
      font-weight: bold;
      padding: 1px 7px;
      border-radius: 20px;
      margin-right: 8px;
      flex-shrink: 0;
      letter-spacing: .03em;
    }
    .badge-overview    { background: #1c1c1c; color: #c8c8c8; border: 1px solid #444; }
    .badge-order       { background: #4a2800; color: #ffcc88; }
    .badge-infraorder  { background: #4b0082; color: #d9b8ff; }
    .badge-section     { background: #7f3000; color: #ffd5a0; }
    .badge-subsection  { background: #7f003f; color: #ffb8d5; }
    .badge-superfamily { background: #003f7f; color: #aad4ff; }
    .badge-family      { background: #00604f; color: #a0ffe0; }
    .node-note         { font-size: 10.5px; color: #5a8870; margin-left: 8px; font-style: italic; }

    .node-label { font-weight: 600; white-space: nowrap; }
    .node-label-en {
      color: #5a8099;
      font-style: italic;
      font-size: 11.5px;
      margin-left: 7px;
      white-space: nowrap;
    }

    /* collapsed state */
    .children.hidden { display: none; }

    /* ── Crab card grid ───────────────────────── */
    .crab-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 0 10px 24px;
    }

    .crab-card {
      width: 120px;
      background: #111e2d;
      border: 1px solid #1e3a52;
      border-radius: 8px;
      overflow: hidden;
      transition: transform .18s, box-shadow .18s, border-color .18s;
      flex-shrink: 0;
    }
    .crab-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
      border-color: #4a8fb5;
    }

    .crab-img-wrap {
      width: 100%;
      height: 80px;
      overflow: hidden;
      background: #0a1520;
      position: relative;
    }
    .crab-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #2a4a62;
    }

    .crab-info { padding: 6px 7px 7px; }
    .crab-jp   { font-size: 11.5px; font-weight: 700; color: #c8dce8; }
    .crab-sci  { font-size: 10px; font-style: italic; color: #567a90; margin-top: 2px; }
    .crab-desc { font-size: 10px; color: #4a6878; margin-top: 3px; line-height: 1.4; }

    /* ── Legend ───────────────────────────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #7a93a8;
    }

    .controls {
      text-align: center;
      margin-bottom: 22px;
    }
    .btn {
      background: #0d2e44;
      border: 1px solid #2e5a78;
      color: #7ecef4;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      margin: 0 4px;
      transition: background .15s;
    }
    .btn:hover { background: #1a4060; }

    /* ── Source note ──────────────────────────── */
    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 11px;
      color: #3a5568;
    }
    footer a { color: #4a7fa0; }
  </style>
</head>

// ─── Rank metadata ─────────────────────────────────────────────────────────
const RANK_META = {
  overview:   { label: '概観', cls: 'badge-overview',    defaultOpen: true  },
  order:      { label: '目',   cls: 'badge-order',       defaultOpen: true  },
  infraorder: { label: '下目', cls: 'badge-infraorder',  defaultOpen: true  },
  section:    { label: '群',   cls: 'badge-section',     defaultOpen: true  },
  subsection: { label: '亜群', cls: 'badge-subsection',  defaultOpen: true  },
  superfamily:{ label: '上科', cls: 'badge-superfamily', defaultOpen: false },
  family:     { label: '科',   cls: 'badge-family',      defaultOpen: false },
};

// ─── Render tree ──────────────────────────────────────────────────────────
function buildTree(node) {
  const div = document.createElement('div');
  div.className = 'node';

  const meta = RANK_META[node.rank] || {};
  const hasChildren = node.children && node.children.length > 0;
  const hasCrabs    = node.crabs   && node.crabs.length   > 0;

  // Header
  const header = document.createElement('div');
  header.className = 'node-header';

  // Toggle arrow (only for nodes with children or crabs)
  const arrow = document.createElement('span');
  arrow.className = 'toggle-icon';
  if (hasChildren || hasCrabs) {
    arrow.textContent = '▶';
    if (meta.defaultOpen) arrow.classList.add('open');
  }
  header.appendChild(arrow);

  // Badge
  const badge = document.createElement('span');
  badge.className = `badge ${meta.cls || ''}`;
  badge.textContent = meta.label || node.rank;
  header.appendChild(badge);

  // Labels
  const label = document.createElement('span');
  label.className = 'node-label';
  label.textContent = node.name;
  header.appendChild(label);

  const labelEn = document.createElement('span');
  labelEn.className = 'node-label-en';
  labelEn.textContent = node.nameEn;
  header.appendChild(labelEn);

  if (node.note) {
    const noteEl = document.createElement('span');
    noteEl.className = 'node-note';
    noteEl.textContent = `（${node.note}）`;
    header.appendChild(noteEl);
  }

  div.appendChild(header);

  // Collapsible content
  const content = document.createElement('div');
  content.className = 'collapsible';
  if (!meta.defaultOpen) content.style.display = 'none';

  // Child nodes
  if (hasChildren) {
    const ul = document.createElement('ul');
    ul.className = 'children';
    node.children.forEach(child => ul.appendChild(buildTree(child)));
    content.appendChild(ul);
  }

  // Crab cards
  if (hasCrabs) {
    const grid = document.createElement('div');
    grid.className = 'crab-grid';
    node.crabs.forEach(crab => grid.appendChild(buildCard(crab)));
    content.appendChild(grid);
  }

  if (hasChildren || hasCrabs) {
    div.appendChild(content);

    header.addEventListener('click', () => {
      const open = content.style.display !== 'none';
      content.style.display = open ? 'none' : '';
      arrow.classList.toggle('open', !open);
    });
  }

  return div;
}

function buildCard(crab) {
  const card = document.createElement('div');
  card.className = 'crab-card';

  const wrap = document.createElement('div');
  wrap.className = 'crab-img-wrap';

  const img = document.createElement('img');
  img.alt = crab.jp;
  img.loading = 'lazy';
  img.src = COM(crab.img);
  img.onerror = () => {
    wrap.innerHTML = '<div class="img-placeholder">🦀</div>';
  };
  wrap.appendChild(img);
  card.appendChild(wrap);

  const info = document.createElement('div');
  info.className = 'crab-info';
  info.innerHTML =
    `<div class="crab-jp">${crab.jp}</div>` +
    `<div class="crab-sci">${crab.sci}</div>` +
    (crab.desc ? `<div class="crab-desc">${crab.desc}</div>` : '');
  card.appendChild(info);

  return card;
}

// ─── Global expand / collapse ──────────────────────────────────────────────
function setAll(open) {
  document.querySelectorAll('.collapsible').forEach(el => {
    el.style.display = open ? '' : 'none';
  });
  document.querySelectorAll('.toggle-icon').forEach(el => {
    if (el.textContent === '▶') el.classList.toggle('open', open);
  });
}

// ─── Mount ─────────────────────────────────────────────────────────────────
document.getElementById('tree').appendChild(buildTree(TREE));
